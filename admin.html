<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Hub - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <div class="max-w-4xl w-full mx-auto px-4 py-8 flex flex-col gap-6">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <div>
                <h1 class="text-xl font-extrabold tracking-tight text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-lock text-purple-600"></i> Admin Portal
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">Manage agent metrics and review reward redemptions</p>
            </div>
            <a href="index.html" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Back to Client Hub
            </a>
        </header>

        <!-- Input Form Card -->
        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xl shadow-slate-200/50 flex flex-col gap-6">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                <h2 class="text-sm font-semibold tracking-wide text-slate-700 uppercase">Input / Update Agent Daily Metrics</h2>
                <span id="currentDateDisplay" class="text-xs text-slate-500 font-medium"></span>
            </div>

            <form id="adminForm" onsubmit="handleAdminSubmit(event)" class="flex flex-col gap-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label for="personName" class="text-xs font-medium text-slate-600">Agent Name</label>
                        <input type="text" id="personName" placeholder="e.g. John Doe" required class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-purple-600">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label for="adminDate" class="text-xs font-medium text-slate-600">Entry Date</label>
                        <input type="date" id="adminDate" required class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-purple-600">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label for="inputXM" class="text-xs font-medium text-slate-600">XM Count</label>
                        <input type="number" step="any" id="inputXM" placeholder="e.g. 2" required min="0" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-purple-600">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label for="inputGSR" class="text-xs font-medium text-slate-600">GSR Count</label>
                        <input type="number" step="any" id="inputGSR" placeholder="e.g. 3" required min="0" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-purple-600">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label for="inputAHT" class="text-xs font-medium text-slate-600">AHT (Seconds)</label>
                        <input type="number" step="any" id="inputAHT" placeholder="e.g. 900" required min="1" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-purple-600">
                    </div>
                </div>

                <button type="submit" class="mt-2 py-3.5 px-6 rounded-xl bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-800 hover:to-indigo-800 text-white font-bold text-sm shadow-md transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Save Entry to Database
                </button>
            </form>
        </div>

        <!-- Reward Redemptions Management -->
        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col gap-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Manage Reward Redemptions</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-700">
                    <thead class="text-slate-400 uppercase font-semibold border-b border-slate-100">
                        <tr>
                            <th class="pb-2">Agent</th>
                            <th class="pb-2">Reward Item</th>
                            <th class="pb-2 text-center">Cost</th>
                            <th class="pb-2 text-center">Status</th>
                            <th class="pb-2 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminRedemptionTableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

        <!-- Database Raw Logs -->
        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col gap-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">All Daily Metric Logs</h3>
            <div class="overflow-x-auto max-h-48 overflow-y-auto pr-1">
                <table class="w-full text-left text-xs text-slate-700">
                    <thead class="text-slate-400 uppercase font-semibold border-b border-slate-100 sticky top-0 bg-white">
                        <tr>
                            <th class="pb-2">Date</th>
                            <th class="pb-2">Agent</th>
                            <th class="pb-2 text-center">XM</th>
                            <th class="pb-2 text-center">GSR</th>
                            <th class="pb-2 text-center">AHT</th>
                            <th class="pb-2 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

    </div>

    <footer class="text-center py-4 text-[11px] text-slate-400">Admin Portal &bull; Supabase Backend Connected</footer>

    <script>
        // HARDCODED CONSTANT SUPABASE CREDENTIALS
        const SUPABASE_URL = "https://icdnpfimwalhkucrjlpn.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljZG5wZmltd2FsaGt1Y3JqbHBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDUzMTIsImV4cCI6MjEwNTg4MTMxMn0.U0L28m4L8KOLCVa2KC8CqjSc0iN0lOrqwmwvVntDruQ";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('adminDate').value = todayStr;
        document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        async function fetchAdminData() {
            const { data: perfData } = await supabaseClient.from('performance_logs').select('*').order('created_at', { ascending: false });
            if (perfData) renderAdminTable(perfData);

            const { data: redData } = await supabaseClient.from('redemption_requests').select('*').order('created_at', { ascending: false });
            if (redData) renderRedemptions(redData);
        }

        async function handleAdminSubmit(e) {
            e.preventDefault();
            const person_name = document.getElementById('personName').value.trim();
            const entry_date = document.getElementById('adminDate').value;
            const xm = parseFloat(document.getElementById('inputXM').value) || 0;
            const gsr = parseFloat(document.getElementById('inputGSR').value) || 0;
            const aht = parseFloat(document.getElementById('inputAHT').value) || 900;

            const { error } = await supabaseClient.from('performance_logs').insert([{ person_name, entry_date, xm, gsr, aht }]);
            if (error) { alert('Failed to insert: ' + error.message); return; }

            document.getElementById('inputXM').value = '';
            document.getElementById('inputGSR').value = '';
            document.getElementById('inputAHT').value = '';
            fetchAdminData();
            alert('Daily metrics saved successfully!');
        }

        async function deletePerformanceRecord(id) {
            if (!confirm('Delete this record?')) return;
            await supabaseClient.from('performance_logs').delete().eq('id', id);
            fetchAdminData();
        }

        async function updateRedemptionStatus(id, newStatus) {
            await supabaseClient.from('redemption_requests').update({ status: newStatus }).eq('id', id);
            fetchAdminData();
        }

        function renderRedemptions(redData) {
            const tbodyAdmin = document.getElementById('adminRedemptionTableBody');
            tbodyAdmin.innerHTML = '';
            redData.forEach(item => {
                const trA = document.createElement('tr');
                trA.className = 'hover:bg-slate-50';
                trA.innerHTML = `
                    <td class="py-2.5 font-medium text-slate-800">${item.person_name}</td>
                    <td class="py-2.5 text-slate-700">${item.reward_item}</td>
                    <td class="py-2.5 text-center font-semibold">${item.points_cost} Pts</td>
                    <td class="py-2.5 text-center font-bold ${item.status === 'Approved' ? 'text-green-600' : item.status === 'Fulfilled' ? 'text-indigo-600' : 'text-amber-600'}">${item.status}</td>
                    <td class="py-2.5 text-right space-x-1">
                        <button onclick="updateRedemptionStatus('${item.id}', 'Approved')" class="px-2 py-1 bg-green-100 text-green-700 rounded text-[10px] font-bold hover:bg-green-200">Approve</button>
                        <button onclick="updateRedemptionStatus('${item.id}', 'Fulfilled')" class="px-2 py-1 bg-indigo-100 text-indigo-700 rounded text-[10px] font-bold hover:bg-indigo-200">Fulfill</button>
                    </td>
                `;
                tbodyAdmin.appendChild(trA);
            });
        }

        function renderAdminTable(records) {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';
            records.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50';
                tr.innerHTML = `
                    <td class="py-2 text-slate-600">${item.entry_date}</td>
                    <td class="py-2 font-semibold text-slate-800">${item.person_name}</td>
                    <td class="py-2 text-center">${item.xm}</td>
                    <td class="py-2 text-center">${item.gsr}</td>
                    <td class="py-2 text-center">${item.aht}s</td>
                    <td class="py-2 text-right">
                        <button onclick="deletePerformanceRecord('${item.id}')" class="text-slate-400 hover:text-red-500 px-2 py-1"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        fetchAdminData();
    </script>
</body>
</html>
